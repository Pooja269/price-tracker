name: Daily Vitamix price check

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC = 9:00 AM Toronto (EST)
  workflow_dispatch: {}     # lets you run it manually from the Actions tab

permissions:
  contents: write           # needed to commit price_history.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check prices and email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python price_tracker.py
      - name: Save price history
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add price_history.json
          git diff --staged --quiet || (git commit -m "Update price history" && git push)
